services:
  glpi:
    image: "glpi/glpi:11"
    restart: "unless-stopped"
    volumes:
      - "${GLPI_VOLUME_HOST_PATH}:/var/glpi:rw"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - glpi_network

  db:
    image: "mysql"
    restart: "unless-stopped"
    volumes:
      - "${MYSQL_VOLUME_PATH}:/var/lib/mysql"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    networks:
      - glpi_network

volumes:
  glpi_data:
  glpi_mysql_data:

networks:
  glpi_network:
